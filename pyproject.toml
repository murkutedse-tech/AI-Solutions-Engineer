[project]
name = "ai-solutions-engineer-assessment"
version = "1.0.0"
description = "MCP server, MCP security gateway, streaming PII guardrail and resilient LLM router."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "regex>=2024.4.16",
    "anyio>=4.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
